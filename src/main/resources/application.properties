spring.application.name=saida-assistida-api

# Credenciais NUNCA ficam no codigo (edital: -10 pts). Vem de variaveis de ambiente.
# Local (IntelliJ): Run > Edit Configurations > Environment variables
#   DB_URL=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL;DB_USER=RMxxxxxx;DB_PASSWORD=...
# Render: cadastrar as mesmas tres variaveis no painel do servico.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

server.port=${PORT:8080}

# Nunca devolver pagina HTML de erro nem stack trace (edital: -5 pts)
server.error.include-stacktrace=never
server.error.include-message=never
spring.mvc.problemdetails.enabled=false
